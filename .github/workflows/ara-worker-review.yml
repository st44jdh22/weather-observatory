name: ARA Worker — non-production regression checks

on:
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/ara-worker-review.yml'
      - '.github/workflows/deploy-ara-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: node --check cloudflare/worker.js
      - name: Run mocked non-production tests (no Cloudflare secrets)
        working-directory: cloudflare
        run: npm test
      - name: Probe public AEMET coastal XML (read-only, informational)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --compressed --max-time 25 \
            --user-agent 'ARAWeatherDesk/verification (+https://st44jdh22.github.io/weather-observatory/ara/)' \
            'https://www.aemet.es/xml/maritima/FQXX44MM.xml' --output /tmp/aemet-coastal.xml
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {parseCoastalAvisos} from './cloudflare/worker.js';
          const raw=fs.readFileSync('/tmp/aemet-coastal.xml','utf8');
          const parsed=parseCoastalAvisos(raw);
          if(!parsed.verified)throw Error('AEMET XML not verified');
          console.log('AEMET coastal XML source reachable; structure parsed; valid time windows checked');
          console.log('Current aviso records:',parsed.avisos.length,'Upcoming:',parsed.upcoming_avisos.length,'Expired bulletin:',parsed.expired);
          NODE
      - name: Verify Worker target and KV binding placeholder
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name = "ara-sr-ai-capitan"' cloudflare/wrangler.toml
          grep -q 'binding = "AI_USAGE"' cloudflare/wrangler.toml
          echo 'No Cloudflare deployment or production writes in this workflow.'
